{% extends "base.html" %}
{% block content %}
<h2 class="page-title mb-4"><i class="fas fa-trophy me-2" style="color:var(--yellow);"></i>Shadow Leaderboard</h2>
<div class="card"><div class="card-body p-0"><table class="table"><thead><tr><th>Rank</th><th>Anonymous ID</th><th>Shadow Score</th><th>Trust Score</th></tr></thead>
<tbody>{% for w in top_workers %}<tr><td>#{{ loop.index }}</td><td><code>{{ w.anonymous_id }}</code></td><td>{{ w.shadow_score }}/100</td><td>{{ w.trust_score }}/1000</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
