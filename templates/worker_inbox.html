{% extends "base.html" %}
{% block content %}
<h2 class="page-title mb-4"><i class="fas fa-envelope me-2"></i>Inbox</h2>
{% if messages %}
<div class="row">{% for m in messages %}<div class="col-12 mb-3"><div class="card"><div class="card-header d-flex justify-content-between"><span><i class="fas fa-building me-2"></i>From: {{ m.sender.name }}</span><span>{{ m.sent_at.strftime('%Y-%m-%d %H:%M') }}</span></div>
<div class="card-body"><h5>{{ m.subject }}</h5><p style="color:var(--muted);">{{ m.body }}</p></div></div></div>{% endfor %}</div>
{% else %}<div class="card p-5 text-center"><i class="fas fa-inbox" style="font-size:3rem;color:var(--muted);"></i><p class="mt-3">No messages yet</p></div>{% endif %}
{% endblock %}
