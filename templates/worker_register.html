{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-header">
        <i class="fas fa-user-plus me-2"></i>WORKER REGISTRATION
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Minimum 8 characters" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn-c w-100">
            <i class="fas fa-shield-halved me-2"></i>Register
          </button>
        </form>
        <hr class="my-4" style="border-color: var(--border);">
        <p class="text-center mb-0">
          <span class="text-m">Already have an account?</span><br>
          <a href="/login" class="btn-c mt-2 w-100" style="font-size:.6rem;">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
