{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card"><div class="card-header"><i class="fas fa-paper-plane me-2"></i>Message to {{ worker.anonymous_id }}</div>
<div class="card-body"><form method="POST"><div class="mb-3"><label class="form-label">Subject</label><input name="subject" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Message</label><textarea name="body" class="form-control" rows="6" required></textarea></div>
<button type="submit" class="btn-c"><i class="fas fa-send me-2"></i>Send Message</button>
<a href="{{ url_for('employer.dashboard') }}" class="btn-cd">Cancel</a></form></div></div>
</div></div>
{% endblock %}
