{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align: center;">
    <h2>{{ skill.name }} Results</h2>
    <h1 style="font-size: 3rem;">{{ "%.1f"|format(score) }}%</h1>
    {% if passed %}
        <div class="alert-success" style="padding: 15px;">
            <h3>PASSED!</h3>
            <p>Your verification hash:</p>
            <code>{{ skill_hash }}</code>
        </div>
    {% else %}
        <div class="alert-danger" style="padding: 15px;">
            <h3>NOT PASSED</h3>
            <p>70% required to pass. Try again!</p>
        </div>
    {% endif %}
    <a href="/worker/skills" class="btn">Try Another</a>
    <a href="/worker/passport" class="btn">View Passport</a>
</div>
{% endblock %}
