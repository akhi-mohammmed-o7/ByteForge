{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-header">
        <i class="fas fa-user me-2"></i>WORKER LOGIN
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="worker@demo.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-c w-100">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </form>
        <hr class="my-4" style="border-color: var(--border);">
        <p class="text-center mb-0">
          <span class="text-m">Demo: worker@demo.com / worker123</span><br>
          <a href="/register" class="btn-c mt-3 w-100" style="font-size:.6rem;">
            <i class="fas fa-user-plus me-2"></i>Create New Account
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
